<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CanvasUI — Model Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    gap: 6px;
    padding: 10px 24px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    flex-wrap: wrap;
  }
  .tab-group {
    display: flex;
    align-items: stretch;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    background: #f8fafc;
  }
  .tab-group.active {
    background: #4f46e5;
    border-color: #4f46e5;
  }
  nav button {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    border: 0;
    background: transparent;
    color: #334155;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .tab-group.active button {
    color: #ffffff;
  }
  .open-icon {
    display: flex;
    align-items: center;
    padding: 0 10px;
    color: #64748b;
    text-decoration: none;
    border-left: 1px solid #e2e8f0;
  }
  .tab-group.active .open-icon {
    color: #ffffff;
    border-left-color: rgba(255,255,255,0.35);
  }
  .open-icon:hover {
    background: rgba(0,0,0,0.12);
  }
  .open-icon svg {
    width: 13px;
    height: 13px;
  }
  main {
    flex: 1;
    min-height: 0;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #ffffff;
  }
</style>
</head>
<body>

<nav id="tabs"></nav>

<main>
  <iframe id="viewer" title="Model output preview"></iframe>
</main>

<script>
  var PAGES = [
    { id: "gemini-3.1-flash-lite", label: "Gemini 3.1 Flash Lite", file: "gemini-3.1-flash-lite.html" },
    { id: "gemini-2.5-flash",      label: "Gemini 2.5 Flash",      file: "gemini-2.5-flash.html" },
    { id: "qwen-7b",               label: "Qwen2.5-VL 7B",         file: "qwen-7b.html" },
    { id: "qwen-14b",              label: "Qwen2.5 Coder 14B",     file: "qwen-14b.html" },
    { id: "qwen-27b",              label: "Qwen3.6 27B",           file: "qwen-27b.html" }
  ];

  var OPEN_ICON_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>' +
    '<path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';

  var tabsEl = document.getElementById("tabs");
  var viewerEl = document.getElementById("viewer");
  var groups = {};

  PAGES.forEach(function (page) {
    var group = document.createElement("div");
    group.className = "tab-group";

    var btn = document.createElement("button");
    btn.textContent = page.label;
    btn.addEventListener("click", function () { selectPage(page.id); });

    var openLink = document.createElement("a");
    openLink.className = "open-icon";
    openLink.href = page.file;
    openLink.target = "_blank";
    openLink.rel = "noopener";
    openLink.title = "Open " + page.label + " in a new tab";
    openLink.innerHTML = OPEN_ICON_SVG;

    group.appendChild(btn);
    group.appendChild(openLink);
    tabsEl.appendChild(group);
    groups[page.id] = group;
  });

  function selectPage(id) {
    var page = PAGES.find(function (p) { return p.id === id; }) || PAGES[0];
    viewerEl.src = page.file;
    Object.keys(groups).forEach(function (gid) {
      groups[gid].classList.toggle("active", gid === page.id);
    });
    history.replaceState(null, "", "#" + page.id);
  }

  var initialId = location.hash ? location.hash.slice(1) : PAGES[0].id;
  selectPage(initialId);
</script>

</body>
</html>
